<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PAGINA TESTE</title>
    <style>
      body {
        background-color: rgb(49, 50, 59);
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      .cartao {
        max-width: 400px;
        margin: 40px auto;
        padding: 30px;
        background-color: rgb(250, 250, 250);
        border-radius: 16px;
        text-align: center;
      }

      .foto {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
      }

      h1 {
        color: rgb(6, 1, 1);
      }

      p {
        color: rgb(4, 0, 0);
        font-size: 18px;
        line-height: 1.6;
      }

      ul {
        list-style: none;
        padding: 0;
      }

      li {
        color: rgb(8, 8, 8);
        margin: 10px 0;
      }

      .botao {
        display: inline-block;
        color: rgb(8, 0, 0);
        text-decoration: none;
        background-color: rgb(213, 211, 215);
        padding: 10px 20px;
        border-radius: 8px;
      }

      .botao:hover {
        background-color: rgb(2, 1, 3);
      }

      .topo {
        display: flex;
        align-items: center;
        gap: 40px;
        text-align: left;
        justify-content: center;
      }

      .foto {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
      }

    @media (max-width: 600px) {
        .topo {
          flex-direction: column;
          text-align: center;
        }

        .cartao {
          padding: 20px;
        }

        .foto {
          width: 80px;
          height: 80px;
        }
      }
    </style>
  </head>
  <body>
    <div class="cartao">
    <div class="topo">
      <img class="foto" src="foto.jpg" alt="Minha foto">
      <div class="info">
      <h1>Gabriel</h1>
      <p>TESTE</p>
    </div>
  </div>  


     <ul>
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
      </ul>
      <a class="botao" href="https://kick.com/coringa" target="_blank">Visite nosso site</a>
    </div>
  </body>
</html>
