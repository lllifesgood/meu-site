<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> CADA VEZ MAIS PERTO DO OBJETIVO</title>
  <style>
    body {
      background-color: rgb(49, 50, 59);
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .cartao {
      max-width: 400px;
      margin: 40px auto;
      padding: 30px;
      background-color: rgb(250, 250, 250);
      border-radius: 16px;
      text-align: center;
    }



    h1 {
      color: rgb(6, 1, 1);
    }

    p {
      color: rgb(4, 0, 0);
      font-size: 18px;
      line-height: 1.6;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      color: rgb(8, 8, 8);
      margin: 10px 0;
    }

    .botao {
      display: inline-block;
      color: rgb(8, 0, 0);
      text-decoration: none;
      background-color: rgb(213, 211, 215);
      padding: 10px 20px;
      border-radius: 8px;
    }

    .botao:hover {
      background-color: rgb(2, 1, 3);
      color: white;
    }

    .button.botao {
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .topo {
      display: flex;
      align-items: center;
      gap: 40px;
      text-align: left;
      justify-content: center;
    }

    .foto {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }

    @media (max-width: 600px) {
      .topo {
        flex-direction: column;
        text-align: center;
      }

      .cartao {
        padding: 20px;
      }

      .foto {
        width: 80px;
        height: 80px;
      }
    }
  </style>
</head>

<body>
  <div class="cartao">
    <div class="topo">
      <img class="foto" src="foto.jpg" alt="Minha foto">
      <div class="info">
        <h1>Apenas um site</h1>
        <div class="info">
          <p id="frase">estou aprendendo programação do zero</p>
          <button class="botao" onclick="mudarFrase()">Mudar Frase</button>
        </div>
      </div>
    </div>


    <ul>
      <li>item 1</li>
      <li>item 2</li>
      <li>item 3</li>
    </ul>
    <a class="botao" href="https://kick.com/coringa" target="_blank">Visite nosso site</a>
  </div>
  <script>
    let cliques = 0

    function mudarFrase() {
      cliques = cliques + 1
      let frase = ""

      if (cliques === 1) {
        frase = "ja sei criar paginas com html e css"
      } else if (cliques === 2) {
        frase = "estou aprendendo java script"
      } else {
        frase = "meu objetivo; trabalhar com programaçao"
      }

      document.getElementById("frase").innerText = frase
    }
  </script>
</body>

</html>
