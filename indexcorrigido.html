<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CADA VEZ MAIS PERTO DO OBJETIVO</title>
  <style>
    body {
      background-color: rgb(49, 50, 59);
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .cartao {
      max-width: 480px;
      margin: 40px auto;
      padding: 30px;
      background-color: rgb(250, 250, 250);
      border-radius: 16px;
      text-align: center;
    }

    h1 {
      color: rgb(6, 1, 1);
      margin: 0 0 8px;
    }

    p {
      color: rgb(4, 0, 0);
      font-size: 18px;
      line-height: 1.6;
      margin: 0 0 16px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 24px 0;
    }

    li {
      color: rgb(8, 8, 8);
      margin: 10px 0;
    }

    .botao {
      display: inline-block;
      color: rgb(8, 0, 0);
      text-decoration: none;
      background-color: rgb(213, 211, 215);
      padding: 10px 20px;
      border-radius: 8px;
    }

    .botao:hover {
      background-color: rgb(2, 1, 3);
      color: white;
    }

    button.botao {
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-family: inherit;
    }

    input {
      padding: 0 12px;
      font-size: 16px;
      font-family: inherit;
      border-radius: 8px;
      border: 1px solid rgb(180, 180, 190);
    }

    .topo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      text-align: left;
    }

    .foto {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    /* botões e campo empilhados, todos com a mesma largura e altura */
    .acoes {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .acoes .botao,
    .acoes input {
      width: 100%;
      height: 42px;
      box-sizing: border-box;
    }

    #aviso {
      margin: 0;
      min-height: 20px;
      font-size: 14px;
      line-height: 1.4;
      color: rgb(176, 0, 32);
    }

    @media (max-width: 600px) {
      .topo {
        flex-direction: column;
        text-align: center;
        gap: 16px;
      }

      .info {
        width: 100%;
      }

      .cartao {
        padding: 20px;
      }

      .foto {
        width: 80px;
        height: 80px;
      }
    }
  </style>
</head>

<body>
  <div class="cartao">
    <div class="topo">
      <img class="foto" src="foto.jpg" alt="Minha foto">
      <div class="info">
        <h1 id="titulo">Apenas um site</h1>
        <p id="frase">Estou aprendendo programação do zero.</p>

        <div class="acoes">
          <button class="botao" onclick="mudarFrase()">Mudar frase</button>
          <input id="nome" type="text" placeholder="Digite seu nome">
          <button class="botao" onclick="mudarTitulo()">Trocar título</button>
          <p id="aviso"></p>
        </div>
      </div>
    </div>

    <ul id="lista"></ul>

    <a class="botao" href="https://kick.com/coringa" target="_blank">Visite nosso site</a>
  </div>

  <script>
    let cliques = 0

    function mudarFrase() {
      cliques = cliques + 1
      let frase = ""

      if (cliques === 1) {
        frase = "Já sei criar páginas com HTML e CSS."
      } else if (cliques === 2) {
        frase = "Estou aprendendo JavaScript."
      } else {
        frase = "Meu objetivo: trabalhar com programação!"
      }

      document.getElementById("frase").innerText = frase
    }

    let gostos = ["Café", "Funk", "POE2", "AION2"]
    let lista = document.getElementById("lista")

    for (let i = 0; i < gostos.length; i++) {
      lista.innerHTML += "<li>" + gostos[i] + "</li>"
    }

    function mudarTitulo() {
      let nome = document.getElementById("nome").value.trim()
      nome = nome.charAt(0).toUpperCase() + nome.slice(1).toLowerCase()

      if (nome === "") {
        document.getElementById("aviso").innerText = "Digite seu nome primeiro!"
      } else {
        document.getElementById("titulo").innerText = "Olá, " + nome + "!"
        document.getElementById("aviso").innerText = ""
      }
    }
  </script>
</body>

</html>
